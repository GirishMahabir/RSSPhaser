<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RSSPhaser{% endblock %}</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0;
            --muted:#94a3b8; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--text); }
    header { background:var(--panel); padding:0.8rem 1.5rem; display:flex; align-items:center;
             gap:1.5rem; border-bottom:1px solid #334155; }
    header h1 { font-size:1.2rem; margin:0; color:var(--accent); }
    header nav a { color:var(--text); text-decoration:none; margin-right:1rem; }
    header nav a:hover { color:var(--accent); }
    header .spacer { flex:1; }
    main { max-width:1000px; margin:1.5rem auto; padding:0 1.5rem; }
    h2 { color:var(--accent); }
    table { width:100%; border-collapse:collapse; margin:1rem 0; background:var(--panel); }
    th, td { padding:0.6rem 0.8rem; text-align:left; border-bottom:1px solid #334155;
             font-size:0.9rem; vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    input[type=text], input[type=url], input[type=password], input[type=number] {
        padding:0.45rem 0.6rem; background:#0b1220; border:1px solid #334155; color:var(--text);
        border-radius:4px; width:100%; }
    label { font-size:0.85rem; color:var(--muted); }
    button, .btn { padding:0.45rem 0.9rem; border:none; border-radius:4px; cursor:pointer;
            background:var(--accent); color:#0b1220; font-weight:600; }
    button.secondary { background:#334155; color:var(--text); }
    button.danger { background:var(--err); color:#fff; }
    .card { background:var(--panel); border:1px solid #334155; border-radius:8px;
            padding:1rem 1.2rem; margin-bottom:1.2rem; }
    .flash { padding:0.6rem 1rem; border-radius:6px; margin:0.5rem 0; }
    .flash.error { background:#7f1d1d; color:#fee2e2; }
    .flash.success { background:#14532d; color:#dcfce7; }
    .pill { padding:0.15rem 0.5rem; border-radius:999px; font-size:0.75rem; font-weight:600; }
    .pill.ok { background:#14532d; color:#bbf7d0; }
    .pill.err { background:#7f1d1d; color:#fecaca; }
    .pill.warn { background:#78350f; color:#fde68a; }
    .pill.muted { background:#334155; color:var(--muted); }
    .inline { display:inline; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:1rem; }
    .stat { background:var(--panel); border:1px solid #334155; border-radius:8px; padding:1rem; }
    .stat .num { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .muted { color:var(--muted); font-size:0.85rem; }
    code { background:#0b1220; padding:0.1rem 0.35rem; border-radius:4px; }
    .row-form td { padding-top:0.4rem; padding-bottom:0.4rem; }
  </style>
</head>
<body>
  {% if session.get('authenticated') %}
  <header>
    <h1>🛰️ RSSPhaser</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('sources') }}">Sources</a>
      <a href="{{ url_for('keywords') }}">Keywords</a>
      <a href="{{ url_for('feed_xml') }}">Feed</a>
    </nav>
    <span class="spacer"></span>
    <a href="{{ url_for('logout') }}">Logout</a>
  </header>
  {% endif %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
